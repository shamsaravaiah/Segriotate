<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Segriotate</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #14161a; color: #e8e6e1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .box { text-align: center; max-width: 420px; padding: 32px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 8px; }
  p { color: #8b909c; font-size: 14px; line-height: 1.5; margin: 0; }
  #status { margin-top: 14px; color: #5eead4; font-size: 13px; min-height: 1.4em; }
  .spinner {
    width: 42px; height: 42px;
    border: 3px solid #2a2e36;
    border-top-color: #5eead4;
    border-radius: 50%;
    margin: 0 auto 22px;
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Launching app.</h1>
    <p>Please wait</p>
    <p id="status"></p>
  </div>
<script>
  async function tick() {
    try {
      const res = await fetch("/health", { cache: "no-store" });
      const data = await res.json();
      const el = document.getElementById("status");
      if (el && data.message) el.textContent = data.message;
      if (data.error) {
        if (el) el.textContent = data.error;
        return;
      }
      if (data.ready) {
        window.location.replace("/");
        return;
      }
    } catch (e) { /* server still coming up */ }
    setTimeout(tick, 700);
  }
  tick();
</script>
</body>
</html>
